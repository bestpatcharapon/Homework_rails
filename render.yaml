databases:
  - name: store_db
    databaseName: store_production
    user: store

services:
  - type: web
    name: store
    env: ruby
    buildCommand: "./bin/render-build.sh"
    preDeployCommand: "./bin/rails db:prepare && ./bin/rails db:seed"
    startCommand: "./bin/rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: store_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
